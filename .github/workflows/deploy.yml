name: Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - deploy
          - destroy-infra
        default: deploy

env:
  AWS_REGION: us-east-1
  APP_DIR: .
  ARTIFACT_PREFIX: artifacts
  APP_TAG: assignment-event-ticketing

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    if: ${{ github.event.inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application artifact
        run: |
          mkdir -p output
          zip -r output/app.zip . -x "*.git*" "envs/*" ".github/*" "output/*"

      - name: Upload artifact to S3
        run: |
          S3_BUCKET="${{ needs.infra.outputs.s3_bucket }}"
          if [ -z "$S3_BUCKET" ]; then
            S3_BUCKET="assignment-s3-uploads-291072715329"
          fi
          aws s3 cp output/app.zip "s3://${S3_BUCKET}/${{ env.ARTIFACT_PREFIX }}/app.zip"

      - name: Trigger SSM Deployment Command
        run: |
          TARGET_TAG="${{ env.APP_TAG }}"
          S3_BUCKET="${{ needs.infra.outputs.s3_bucket }}"
          if [ -z "$S3_BUCKET" ]; then
            S3_BUCKET="assignment-s3-uploads-291072715329"
          fi

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=${TARGET_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found with tag App=${TARGET_TAG}."
            exit 1
          fi

          COMMANDS=$(cat <<EOF
          aws s3 cp s3://${S3_BUCKET}/${{ env.ARTIFACT_PREFIX }}/app.zip /tmp/app.zip
          sudo rm -rf /var/www/html/*
          sudo unzip -o /tmp/app.zip -d /var/www/html/
          sudo chown -R www-data:www-data /var/www/html/
          sudo chmod -R 755 /var/www/html/
          EOF
          )

          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(echo "$COMMANDS" | jq -R -s '.')]"\
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id $(echo $INSTANCE_IDS | awk '{print $1}')

  destroy-infra:
    name: Destroy Infrastructure
    if: ${{ github.event.inputs.mode == 'destroy-infra' }}
    uses: ./.github/workflows/build.yml
    with:
      action: destroy
    secrets: inherit
